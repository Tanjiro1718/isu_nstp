<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Invitation unavailable</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #006837 0%, #004d25 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }
        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fff5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #c53030;
        }
        h1 { color: #1a202c; font-size: 24px; margin-bottom: 12px; }
        p { color: #4a5568; font-size: 15px; line-height: 1.6; }
        a {
            display: inline-block;
            margin-top: 24px;
            background: #006837;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#9888;</div>
        <h1>Invitation unavailable</h1>
        <p>
            This class invitation link is invalid or has been replaced by your
            instructor. Ask them for a new link or for the class join code.
        </p>
        <a href="/">Open ISU NSTP</a>
    </div>
</body>
</html>
